[versions]
agp = "9.4.1"
junit = "4.13.2"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.2"
work = "2.12.0"
playServicesAuth = "22.0.0"
mlkitFace = "16.1.7"
mlkitLabeling = "17.0.9"
mlkitGenaiImageDescription = "1.0.0-beta1"
