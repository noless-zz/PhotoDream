plugins {
    alias(libs.plugins.android.application)
}

// Release signing key lives OUTSIDE the repo: ../PhotoDream-signing/ (see README.txt there)
def signingProps = new Properties()
def signingFile = rootProject.file('../PhotoDream-signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.noam.photodream'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.noam.photodream"
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName "0.2"
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile new File(signingFile.parentFile, signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        // Debug builds use the same key, so Google sign-in (registered for one
        // SHA-1) works from Android Studio too, and debug/release can update each other.
        debug {
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.work.runtime
    implementation libs.play.services.auth
    testImplementation libs.junit
}
